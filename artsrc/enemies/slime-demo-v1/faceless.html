<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Green Slime · Faceless animation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171321;color:white;font-family:Arial,sans-serif}main{max-width:680px;padding:18px;margin:auto}h1{font-size:24px;text-align:center}.screen{border:4px solid #0c0b10;border-radius:18px;background:#30263f;overflow:hidden}.header{text-align:center;padding:14px;font-size:22px;font-weight:bold}.stage{position:relative;aspect-ratio:1.5;background:url('stage.png') center/cover}.sprite{position:absolute;width:42%;aspect-ratio:1.5;left:29%;bottom:12%;background-image:url('faceless-sheet.png');background-size:600% 400%;background-repeat:no-repeat}.name{text-align:center;padding:16px;font-size:22px;font-weight:bold}.role{display:block;font-size:14px;color:#d0c4e2;margin-top:8px}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px}button{border:3px solid #110d19;border-radius:10px;background:#62437f;color:white;padding:12px 16px;font:700 15px Arial;cursor:pointer}button[aria-pressed=true]{background:#9654e1;border-color:#f1cb49}button:focus-visible{outline:3px solid #45d6ce}.status{text-align:center;font-size:14px;color:#d0c4e2;min-height:36px}.samples{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.sample{background:#30263f;border-radius:12px;border:3px solid #100d17;text-align:center;padding:10px}.sample-art{position:relative;aspect-ratio:1.5;background-image:url('faceless-sheet.png');background-size:600% 400%;background-repeat:no-repeat}small{display:block;text-align:center;color:#d0c4e2;margin:18px 0;line-height:1.5}
.sprite,.sample-art{aspect-ratio:1;background-image:none}
</style>
<main><h1>GREEN SLIME · BITE DEMO</h1><section class="screen"><div class="header">ENEMY CODEX</div><div class="stage"><canvas class="sprite" width="512" height="512" role="img" aria-label="Eyeless green slime animation"></canvas></div><div class="name">Green Slime<span class="role">Chapter 1 · Common · Melee bite</span></div><div class="controls states"></div><div class="controls"><button id="pause" type="button">Pause</button><button id="replay" type="button">Replay</button><button id="step" type="button">Next frame</button></div><div class="status" aria-live="polite"></div></section><div class="samples"></div><small>6 key poses per state · Preview only, not installed in Unity.<br>Attack: mouth only, no eyes. Dead plays once and holds.</small></main>
<script>
const names=['Idle','Walk','Attack','Dead'],durations=[1.2,.9,.95,.8];let state=2,elapsed=0,paused=false,last=performance.now();const buttons=document.querySelector('.states'),samples=document.querySelector('.samples');
const base=new Image(),bite=new Image();base.src='faceless-sheet-clean.png';bite.src='bite-sheet-v2-toothless.png';
names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.type='button';b.onclick=()=>{state=i;elapsed=0;render()};buttons.append(b);const d=document.createElement('div');d.className='sample';d.innerHTML=`<strong>${n}</strong><canvas class="sample-art" width="512" height="512" role="img" aria-label="${n} preview" data-state="${i}" style="width:100%"></canvas>`;samples.append(d)});
function render(){[...buttons.children].forEach((b,i)=>b.setAttribute('aria-pressed',i===state));document.querySelector('.status').textContent=names[state]+(state===3?' · final pose held':' · loop')}
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause'};document.querySelector('#replay').onclick=()=>{elapsed=0;paused=false;document.querySelector('#pause').textContent='Pause'};
document.querySelector('#step').onclick=()=>{paused=true;document.querySelector('#pause').textContent='Play';const t=state===3?Math.min(elapsed,durations[state]-.0001):elapsed%durations[state];const f=Math.min(5,Math.floor(t/durations[state]*6));elapsed=((f+1)%6+.05)/6*durations[state]};
function position(el,row,time){let p=row===3?Math.min(time/durations[row],.9999):(time%durations[row])/durations[row];let frame=Math.min(5,Math.floor(p*6));const ctx=el.getContext('2d');ctx.clearRect(0,0,el.width,el.height);const img=row===2?bite:base;if(!img.complete||!img.naturalWidth)return;const cols=row===2?3:6,rows=row===2?2:4;const w=img.naturalWidth/cols,h=img.naturalHeight/rows;const col=row===2?frame%3:frame,r=row===2?Math.floor(frame/3):row;const baselineOffsets=[11,11,11,56,53,53];const dy=row===2?baselineOffsets[frame]*el.height/512:0;ctx.drawImage(img,col*w,r*h,w,h,0,dy,el.width,el.height)}
let allTime=0;function tick(now){let dt=Math.min((now-last)/1000,.1);last=now;if(!paused){elapsed+=dt;allTime+=dt}position(document.querySelector('.sprite'),state,elapsed);document.querySelectorAll('.sample-art').forEach(el=>position(el,Number(el.dataset.state),allTime%3));requestAnimationFrame(tick)}render();requestAnimationFrame(tick);
</script></html>
