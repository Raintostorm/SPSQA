<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Green Slime · Approved eyes animation</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#1c1727;color:white;font:16px Arial}main{max-width:720px;margin:auto}h1{font-size:23px}.stage{position:relative;aspect-ratio:1.5;background:url('stage.png') center/cover;border:4px solid #0c0a12;border-radius:14px;overflow:hidden}.hero{position:absolute;left:18%;bottom:4%;width:64%;height:auto}.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}button{font:700 15px Arial;padding:12px 16px;border:3px solid #100b17;border-radius:10px;background:#644380;color:white;cursor:pointer}button[aria-pressed=true]{background:#9351d6;border-color:#e9c74c}button:focus-visible{outline:3px solid #48cbb9}.status{text-align:center;color:#d0c1df;font-size:14px;min-height:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.sample{background:#393045;border:3px solid #100b17;border-radius:12px;text-align:center;padding:12px}.sample canvas{width:100%;height:auto}p{font-size:14px;color:#d0c1df;line-height:1.6}h2{font-size:17px;margin:0}select{padding:8px;font:inherit;background:#393045;color:white;border-radius:7px;border:1px solid #6a5b7a}
</style><main><h1>GREEN SLIME · COMMON</h1><div class="stage"><canvas class="hero" width="600" height="380" role="img" aria-label="Green slime selected animation"></canvas></div><div class="controls states"></div><div class="controls"><button id="pause">Pause</button><button id="replay">Replay</button><button id="step">Next frame</button><label>Speed <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option></select></label></div><div class="status" aria-live="polite"></div><div class="grid"></div><p>Generated key-pose draft · Idle / Walk / Attack / Dead · No teeth.<br>Attack direction: inflate → spit slime → recover. Preview only, not installed in Unity.</p></main><script>
const ids=['idle','walk','attack','dead'],names=['Idle','Walk','Attack','Dead'];
const holds=[[.18,.22,.18,.22,.2,.2],[.12,.1,.16,.14,.1,.14],[.24,.30,.25,.10,.16,.30],[.13,.13,.14,.17,.2,.4]];
const totals=holds.map(a=>a.reduce((x,y)=>x+y,0));const images=ids.map(id=>{let im=new Image();im.src='eyes-'+id+'.png';return im});
let state=0,elapsed=0,all=0,last=performance.now(),paused=false,speed=1;const controls=document.querySelector('.states'),grid=document.querySelector('.grid');
ids.forEach((id,i)=>{let b=document.createElement('button');b.textContent=names[i];b.onclick=()=>{state=i;elapsed=0;render()};controls.append(b);let s=document.createElement('section');s.className='sample';s.innerHTML=`<h2>${names[i]}</h2><canvas width="600" height="380" data-row="${i}" aria-label="${names[i]} preview"></canvas>`;grid.append(s)});
function frameAt(row,time){let t=row===3?Math.min(time,totals[row]-.00001):time%totals[row],sum=0;for(let f=0;f<6;f++){sum+=holds[row][f];if(t<sum)return f}return 5}
const offsets=[[4,0,4,34,31,31],[-17,-17,-17,14,14,14],[1,1,1,41,41,39],[-21,-25,-25,58,60,60]];
function draw(canvas,row,time){let ctx=canvas.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);let im=images[row];if(!im.complete||!im.naturalWidth)return;let f=frameAt(row,time),w=im.naturalWidth/3,h=im.naturalHeight/2;ctx.drawImage(im,(f%3)*w,Math.floor(f/3)*h,w,h,110,-22+offsets[row][f]*380/512,380,380)}
function render(){[...controls.children].forEach((b,i)=>b.setAttribute('aria-pressed',i===state));document.querySelector('.status').textContent=names[state]+(state===3?' · holds final pose':' · loop')}
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause'};document.querySelector('#replay').onclick=()=>{elapsed=all=0;paused=false;document.querySelector('#pause').textContent='Pause'};document.querySelector('#speed').onchange=e=>speed=Number(e.target.value);
document.querySelector('#step').onclick=()=>{paused=true;document.querySelector('#pause').textContent='Play';const f=(frameAt(state,elapsed)+1)%6;elapsed=holds[state].slice(0,f).reduce((a,b)=>a+b,0)+.001};
function tick(now){let dt=Math.min((now-last)/1000,.1);last=now;if(!paused){elapsed+=dt*speed;all+=dt*speed}draw(document.querySelector('.hero'),state,elapsed);document.querySelectorAll('[data-row]').forEach(c=>draw(c,Number(c.dataset.row),all%3));requestAnimationFrame(tick)}render();requestAnimationFrame(tick);
</script></html>
