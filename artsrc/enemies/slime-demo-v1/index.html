<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 1 · Slime animation review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151321;color:#fff;font-family:Arial,sans-serif}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 8px}p{color:#c9c3dc}button{font:inherit;color:inherit;cursor:pointer;border:3px solid #100d18;border-radius:12px;background:#514360;padding:12px}button:focus-visible{outline:3px solid #40e6c4}button[aria-pressed=true]{background:#8b4de1;border-color:#efc844}.layout{display:grid;grid-template-columns:380px 1fr;gap:24px;margin-top:24px}.phone{background:#30283f;border:5px solid #100d18;border-radius:24px;overflow:hidden}.top{text-align:center;padding:22px;background:#282135;font-weight:bold;font-size:24px}.stage{background:linear-gradient(#46c7f3 0 45%,#87bc63 45% 67%,#9ad858 67%);position:relative;height:290px;overflow:hidden}.stage:before{content:"";position:absolute;left:10%;right:10%;bottom:25px;height:58px;border-radius:50%;background:#e0ca7d;border:3px solid #7eae4a}.sprite{width:220px;height:220px;background-size:400% 400%;background-repeat:no-repeat;position:relative;flex:none}.stage .sprite{position:absolute;bottom:20px;left:50%;margin-left:-110px}.role{position:absolute;top:16px;left:0;right:0;text-align:center;font-weight:bold;color:#172527}.info{padding:18px;text-align:center}.info h2{margin:0 0 12px}.tags{display:flex;justify-content:center;gap:8px}.tags span{background:#171420;padding:6px 10px;border-radius:6px}.description{min-height:42px;font-size:14px;line-height:1.5}.roster{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}.roster button{padding:0 4px 12px;overflow:hidden}.roster .sprite{width:130px;height:130px;margin:auto}.roster strong,.roster small{display:block}.roster small{margin-top:5px;color:#e1d9ed}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.controls button{font-size:14px}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sample{background:#30283f;border:3px solid #100d18;border-radius:12px;text-align:center;overflow:hidden}.sample .sprite{width:180px;height:180px;margin:auto}.sample strong{display:block;padding:0 4px 12px}.status{font-size:14px;color:#cfbedf}.notes{font-size:14px;line-height:1.6}.sheet{color:#a4e2ff}.toggle{background:#c28d26}.replay{background:#167c65}@media(max-width:760px){main{padding:14px}.layout{grid-template-columns:1fr}.phone{max-width:380px;margin:auto;width:100%}.sample .sprite{width:145px;height:145px}}
.stage{background:#9ad858 url('stage.png') center/cover}.stage:before{display:none}
</style>
<main><h1>CHAPTER 1 · SLIMES</h1><p>Original art · 2 melee / 2 ranged · Animation & UI demo</p>
<div class="layout"><section class="phone" aria-label="Enemy codex UI"><div class="top">ENEMY CODEX</div><div class="stage"><div class="role"></div><div class="sprite hero" role="img"></div></div><div class="info"><h2></h2><div class="tags"></div><p class="description"></p></div><div class="roster"></div></section>
<section><h2>Animation preview</h2><div class="controls states" aria-label="Animation states"></div><div class="controls"><button class="toggle" type="button">Pause</button><button class="replay" type="button">Replay</button></div><p class="status" aria-live="polite"></p><div class="gallery"></div><p class="notes">Four generated key poses per state. Idle and Walk loop; Attack has windup, impact and recovery; Dead plays once and holds. Preview only — not installed in Unity.</p><a class="sheet" href="README.md">Asset notes & prompts</a></section></div></main>
<script>
const data=[{id:'moss',name:'Moss Slime',role:'Melee',type:'Body slam',desc:'Small front-line slime. Squashes down before lunging into its target.'},{id:'iron',name:'Iron Slime',role:'Melee',type:'Headbutt',desc:'Armored front-line slime. A heavy helmet gives its attack a distinct silhouette.'},{id:'spore',name:'Spore Slime',role:'Ranged',type:'Spore shot',desc:'Back-line slime. Inflates, then spits a purple spore toward its target.'},{id:'ember',name:'Ember Slime',role:'Ranged',type:'Fireball',desc:'Back-line slime. Winds up and fires a small orange fireball.'}];
const states=['Idle','Walk','Attack','Dead'], durations=[.8,1.0167,1.5167,.5833];
let selected=0,state=0,paused=false,elapsed=0,last=performance.now();
const roster=document.querySelector('.roster'), gallery=document.querySelector('.gallery'),controls=document.querySelector('.states');
data.forEach((d,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<div class="sprite" style="background-image:url('${d.id}.png')" aria-hidden="true"></div><strong>${d.name}</strong><small>${d.role}</small>`;b.onclick=()=>{selected=i;render()};roster.append(b);const s=document.createElement('div');s.className='sample';s.innerHTML=`<div class="sprite" style="background-image:url('${d.id}.png')" role="img" aria-label="${d.name}"></div><strong>${d.name} · ${d.role}</strong>`;gallery.append(s)});
states.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.type='button';b.onclick=()=>{state=i;elapsed=0;render()};controls.append(b)});
function render(){const d=data[selected];document.querySelector('.hero').style.backgroundImage=`url('${d.id}.png')`;document.querySelector('.hero').setAttribute('aria-label',d.name+' '+states[state]);document.querySelector('.role').textContent='Chapter 1 · '+d.role;document.querySelector('.info h2').textContent=d.name;document.querySelector('.tags').innerHTML=`<span>${d.role}</span><span>${d.type}</span>`;document.querySelector('.description').textContent=d.desc;[...roster.children].forEach((b,i)=>b.setAttribute('aria-pressed',i===selected));[...controls.children].forEach((b,i)=>b.setAttribute('aria-pressed',i===state));document.querySelector('.status').textContent=states[state]+(state===3?' · one-shot, holds final pose':' · loop')}
document.querySelector('.toggle').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause'};document.querySelector('.replay').onclick=()=>{elapsed=0;paused=false;document.querySelector('.toggle').textContent='Pause'};
function tick(now){if(!paused)elapsed+=(now-last)/1000;last=now;const t=state===3?Math.min(elapsed/durations[state],.99999):(elapsed%durations[state])/durations[state], frame=Math.min(3,Math.floor(t*4));document.querySelectorAll('.hero,.gallery .sprite').forEach(s=>s.style.backgroundPosition=`${frame/3*100}% ${state/3*100}%`);document.querySelectorAll('.roster .sprite').forEach(s=>s.style.backgroundPosition='0% 0%');requestAnimationFrame(tick)}render();requestAnimationFrame(tick);
</script></html>
