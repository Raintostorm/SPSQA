<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 1 · Enemy Slimes</title><style>body{background:#1d1728;color:white;font:16px Arial;margin:0;padding:18px}main{max-width:900px;margin:auto}h1{font-size:23px}h2{font-size:17px;margin:0}p{color:#d0c3de;line-height:1.5}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{padding:12px 18px;border:3px solid #0f0a16;border-radius:9px;background:#604078;color:white;font:700 15px Arial;cursor:pointer}button[aria-pressed=true]{border-color:#f5cd50;background:#9451d8}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.unit{background:#382c49;border:3px solid #100c18;border-radius:12px;padding:12px;text-align:center}.unit canvas{width:100%;height:auto;background:linear-gradient(#375246,#476c40);border-radius:8px}.unit small{display:block;color:#d0c3de;margin-top:8px}.status{min-height:24px}</style><main><h1>CHAPTER 1 · SLIME ENEMIES</h1><p>4 Common · 1 Elite · 1 Boss</p><div class="controls states"></div><div class="controls"><button id="pause">Pause</button><button id="replay">Replay</button><button id="bitepose">Bite pose</button></div><div class="status"></div><div class="grid"></div><p>Elite: every third wave. One Boss: final wave. Specials replace an existing spawn; total enemy count is unchanged.</p></main><script src="enemy-layouts.js"></script><script>
const units=[['amber','Amber Slime','Common · Melee'],['stone','Stone Slime','Common · Melee'],['green','Green Slime','Common · Ranged'],['violet','Violet Slime','Common · Ranged'],['elite','Bramble Slime','Elite · Melee'],['boss','Slime Overlord','Boss · Melee']];const states=['idle','walk','attack','dead'];let row=0,time=0,last=performance.now(),paused=false;let textures={};
for(const[id,name,role]of units){let s=document.createElement('section');s.className='unit';s.innerHTML=`<canvas width="400" height="260" data-id="${id}" aria-label="${name} animation"></canvas><h2>${name}</h2><small>${role}</small>`;document.querySelector('.grid').append(s);for(const state of id==='green'?states:['sheet']){let key=id==='green'?'green_'+state:id;let im=new Image();im.src=id==='green'?'eyes-'+state+'.png':'enemy-'+id+'.png';textures[key]=im}}
states.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s[0].toUpperCase()+s.slice(1);b.onclick=()=>{row=i;time=0;render()};document.querySelector('.states').append(b)});
for(const id of ['amber','stone','elite','boss']){let im=new Image();im.src='enemy-'+id+'-bite.png';textures[id+'_bite']=im}
function render(){[...document.querySelector('.states').children].forEach((b,i)=>b.setAttribute('aria-pressed',row===i));document.querySelector('.status').textContent=states[row]+(row===3?' · one-shot':' · loop')}
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause'};document.querySelector('#replay').onclick=()=>{time=0;paused=false;document.querySelector('#pause').textContent='Pause'};
document.querySelector('#bitepose').onclick=()=>{row=2;time=.46;paused=true;document.querySelector('#pause').textContent='Play';render()};
function tick(now){if(!paused)time+=Math.min(.1,(now-last)/1000);last=now;document.querySelectorAll('canvas').forEach(c=>{let id=c.dataset.id,bite=row===2&&['amber','stone','elite','boss'].includes(id),key=id==='green'?'green_'+states[row]:bite?id+'_bite':id,im=textures[key],poses=enemyLayouts[key],count=id==='green'||bite?6:4,duration=row===2?(bite ? .85 : 1.35):1;let phase=row===3?Math.min(time/duration,.9999):(time%duration)/duration;let f=Math.min(count-1,Math.floor(phase*count));if(bite){let t=time%.85,ends=[.20,.40,.52,.60,.70,.85];f=ends.findIndex(end=>t<end);if(f<0)f=5}let p=poses[id==='green'||bite?f:row*4+f],base=enemyLayouts[id==='green'?'green_idle':id][0],scale=(id==='boss'?135:id==='elite'?110:95)/base.bodyHeight*(bite?textures[id].naturalHeight/4/(im.naturalHeight/2):1),ctx=c.getContext('2d');ctx.clearRect(0,0,400,260);if(!im.complete||!im.naturalWidth)return;let x=200-p.pivotX*p.w*scale,y=220-(1-p.pivotY)*p.h*scale;ctx.drawImage(im,p.x,im.naturalHeight-p.y-p.h,p.w,p.h,x,y,p.w*scale,p.h*scale)});requestAnimationFrame(tick)}render();requestAnimationFrame(tick);
</script></html>
