<div id="skill-roll-review">
 <div class="review-controls"><label>Skill <select data-skill><option value="human">Human</option><option value="elf">Elf</option><option value="machine">Machine</option><option value="dead">Dead</option><option value="monster">Monster</option></select></label><label>Tốc độ <select data-speed><option value="1">x1</option><option value="2">x2</option><option value="3">x3</option></select></label><button data-play>▶ Skill</button><button data-roll>🎲 Roll</button></div>
 <canvas width="640" height="300" aria-label="Demo sprite và effect đang dùng trong game"></canvas><p data-status aria-live="polite">Sprite và art thật · demo bố cục</p>
 <div class="viz-carousel viz-dotted-background" aria-label="Đề xuất bộ nút và ô đồng minh">
  <section data-variant="Icon gọn"><div class="game-ui"><div class="game-toolbar"><span>🪙 40</span><button class="speed">x2</button><button class="menu" aria-label="Menu">☰</button></div><div class="unit-grid"><button class="unit selected" aria-label="Chọn Dead Legendary"><img data-art="deadIdle"><span>★</span></button><button class="unit" aria-label="Ô trống">+</button><button class="unit" aria-label="Ô trống">+</button><button class="unit" aria-label="Ô trống">+</button></div><div class="game-actions"><button class="roll"><img data-art="rollIcon"><span>20</span></button><button class="battle"><img data-art="battleIcon"><span>Vào trận</span></button></div><div class="dropdown" hidden><button><img data-art="statsIcon">Thống kê</button><button><img data-art="settingsIcon">Cài đặt</button><button><img data-art="homeIcon">Trang chủ</button></div></div></section>
  <section data-variant="Nhãn ngắn" hidden><div class="game-ui"><div class="game-toolbar"><span>🪙 40</span><button class="speed">x2</button><button class="menu" aria-label="Menu">☰</button></div><div class="unit-grid"><button class="unit selected" aria-label="Chọn Dead Legendary"><img data-art="deadIdle"><span>★</span></button><button class="unit" aria-label="Ô trống">+</button><button class="unit" aria-label="Ô trống">+</button><button class="unit" aria-label="Ô trống">+</button></div><div class="game-actions labels"><button class="roll"><img data-art="rollIcon"><span>Quay · 20</span></button><button class="battle"><img data-art="battleIcon"><span>Chiến đấu</span></button></div><div class="dropdown" hidden><button><img data-art="statsIcon">Thống kê</button><button><img data-art="settingsIcon">Cài đặt</button><button><img data-art="homeIcon">Trang chủ</button></div></div></section>
 </div>
</div>
<style>
#skill-roll-review{max-width:736px;margin:auto;color:#eaf5ff;font:14px system-ui}#skill-roll-review .review-controls{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0;color:light-dark(#18202e,#eef5ff)}#skill-roll-review .review-controls button,#skill-roll-review select{padding:8px;border-radius:8px}#skill-roll-review canvas{display:block;width:100%;height:auto;border-radius:12px}#skill-roll-review p{color:light-dark(#18202e,#eef5ff)}#skill-roll-review .game-ui{position:relative;max-width:440px;margin:16px auto;background:#152337;padding:16px;border:3px solid #050c15;border-radius:18px;box-shadow:0 5px 0 #050c15;min-height:250px}#skill-roll-review .game-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}#skill-roll-review .game-toolbar span{flex:1;color:#ffdc61}#skill-roll-review .game-ui button{background:#21374b;color:#fff;border:2px solid #050c15;border-radius:12px;min-height:44px;padding:8px 16px;box-shadow:0 3px 0 #050c15;font:700 16px system-ui}#skill-roll-review .unit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}#skill-roll-review .unit{position:relative;height:78px;padding:4px!important;background:#6c5934!important}#skill-roll-review .unit.selected{border-color:#ffdc61;box-shadow:0 0 0 3px #ffdc6140}#skill-roll-review .unit img{height:64px;max-width:100%;object-fit:contain}#skill-roll-review .unit span{position:absolute;right:5px;bottom:0;color:#ffdc61}#skill-roll-review .game-actions{display:flex;gap:12px}#skill-roll-review .game-actions button{display:flex;align-items:center;justify-content:center;gap:12px;min-height:62px}#skill-roll-review .game-actions .roll{background:linear-gradient(#39c5ff,#058bdb);flex:1}#skill-roll-review .game-actions .battle{background:linear-gradient(#ffe67b,#ef990e);color:#271808;flex:2}#skill-roll-review .game-actions img{width:38px;height:38px;object-fit:contain}#skill-roll-review .dropdown{position:absolute;right:15px;top:64px;width:220px;background:#121525;padding:10px;border:3px solid #050c15;border-radius:12px;z-index:2}#skill-roll-review .dropdown button{display:flex;align-items:center;width:100%;gap:10px;margin:5px 0;background:#7442b8}#skill-roll-review .dropdown img{width:28px;height:28px;object-fit:contain}@media(max-width:400px){#skill-roll-review .game-ui{padding:10px}#skill-roll-review .unit-grid{gap:6px}#skill-roll-review .game-actions button{padding:8px;font-size:14px;gap:6px}}
</style>
<script>
(()=>{const root=document.getElementById('skill-roll-review'),data=__ASSETS__,canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d'),images={};let mode='skill',elapsed=0,playing=false,last=0,rank=0;const colors=['#ffffff','#3694ff','#ba6aff','#ffcf32'];
for(const [k,v]of Object.entries(data.images)){const im=new Image();im.src=v;images[k]=im;}
root.querySelectorAll('[data-art]').forEach(el=>el.src=data.images[el.dataset.art]);
root.querySelectorAll('.unit').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('.unit').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');});root.querySelectorAll('.menu').forEach(b=>b.onclick=()=>{const d=b.closest('.game-ui').querySelector('.dropdown');d.hidden=!d.hidden;});root.querySelectorAll('.speed').forEach(b=>b.onclick=()=>b.textContent='x'+(Number(b.textContent.slice(1))%3+1));root.querySelectorAll('.roll').forEach(b=>b.onclick=()=>start('roll'));root.querySelectorAll('.battle').forEach(b=>b.onclick=()=>start('skill'));
function start(m){mode=m;elapsed=0;playing=true;if(m==='roll')rank=(rank+1)%4;}root.querySelector('[data-play]').onclick=()=>start('skill');root.querySelector('[data-roll]').onclick=()=>start('roll');root.querySelector('[data-skill]').onchange=()=>{elapsed=0;playing=false;draw();};
function actor(race,step,x,y,h=76){const f=data.clips[race][Math.min(41,step)],im=images[f.key];if(!im?.complete)return;const s=h/240;ctx.drawImage(im,x-f.pivot[0]*f.w*s,y-(1-f.pivot[1])*f.h*s,f.w*s,f.h*s);}
function fx(key,step,x,y,w,pivot=.27){const im=images[key];if(!im?.complete)return;const sw=im.naturalWidth/3,sh=im.naturalHeight/2;ctx.drawImage(im,step%3*sw,Math.floor(step/3)*sh,sw,sh,x-w/2,y-w*(1-pivot),w,w);}
function draw(){ctx.fillStyle='#e2bc64';ctx.fillRect(0,0,640,300);ctx.fillStyle='#87ba42';ctx.fillRect(0,0,640,48);const race=root.querySelector('[data-skill]').value,t=elapsed;
if(mode==='roll'){ctx.fillStyle='#17263b';ctx.fillRect(65,220,510,65);ctx.fillStyle=colors[rank];ctx.font='700 20px system-ui';ctx.fillText(['Common','Rare','Epic','Legend'][rank],85,260);const u=Math.max(0,Math.min(1,(t-1.95)/.55));if(t<1.95){ctx.fillStyle='#ffdc61';ctx.fillText(['♜','✦','♛'][Math.floor(t*12)%3],300,260);}else{const x=150+u*290,y=250-u*75;ctx.strokeStyle=colors[rank];ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(x-30,y+8);ctx.lineTo(x,y);ctx.stroke();if(t>=2.5){ctx.strokeStyle=colors[rank];ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(440,175,35,9,0,0,Math.PI*2);ctx.stroke();actor('dead',0,440,175);}}}
else{actor(race,Math.floor(Math.min(t,1.399)*30),190,205);const impact=(race==='human'?10:race==='dead'?12:22)/30,local=t-impact;
if(local>=0){const key={human:'humanFx',elf:'elfFx',machine:'machineFx',monster:'monsterFx',dead:'deadFx'}[race],dur={human:.8,elf:1.2,machine:2,monster:.9,dead:1.1}[race];if(local<dur){const n=Math.min(5,Math.floor(local/dur*6));if(race==='dead'){for(let i=0;i<3;i++)fx(key,n,350+i*55,205,85,.14);}else fx(key,n,race==='elf'?420:190,race==='machine'?165:race==='monster'?115:205,race==='human'?165:race==='elf'?220:110,race==='machine'||race==='monster'?.5:.27);}}
} }
function tick(now){if(!last)last=now;const dt=Math.min(.05,(now-last)/1000);last=now;if(playing){elapsed+=dt*Number(root.querySelector('[data-speed]').value);if(elapsed>(mode==='roll'?3.2:2.8)){playing=false;root.querySelector('[data-status]').textContent='Demo kết thúc · chọn tốc độ rồi phát lại';}}draw();requestAnimationFrame(tick);}requestAnimationFrame(tick);
})();
</script>
